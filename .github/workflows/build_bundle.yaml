name: Build and publish patched Restreamer

on:
  push:
    branches: [2.x]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: read

concurrency:
  group: restreamer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: armv7
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.arch == 'armv7' && 'linux/arm/v7' || format('linux/{0}', matrix.arch) }}
          load: true
          tags: restreamer:verify
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0 AND GPL-3.0-or-later
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          no-cache-filters: ffmpeg-build,runtime
      - name: Exercise authentication, encoding, and restart
        run: python3 build/smoke.py restreamer:verify
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
      - name: Audit Go and npm dependency locks including build tools
        run: trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --exit-code 1 build
      - name: Audit all image vulnerabilities
        run: trivy image --scanners vuln --format json --output audit.json restreamer:verify
      - name: Block high and critical vulnerabilities
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 restreamer:verify
      - name: Generate SBOM
        run: trivy image --format cyclonedx --output sbom.json restreamer:verify
      - name: Export verified image
        run: docker save restreamer:verify --output image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: image.tar
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-${{ matrix.arch }}
          path: |
            audit.json
            sbom.json

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/2.x' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64, armv7]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-${{ matrix.arch }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exactly the verified image
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          ARCH: ${{ matrix.arch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:build-${RUN_ID}-${ATTEMPT}-${ARCH}"
          docker load --input image.tar
          docker tag restreamer:verify "$image"
          docker push "$image"

  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set repository image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/2.x' }}
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:build-$RUN_ID-$ATTEMPT-amd64" \
            "$IMAGE:build-$RUN_ID-$ATTEMPT-arm64" \
            "$IMAGE:build-$RUN_ID-$ATTEMPT-armv7"
